<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Teleprompter</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Main layout: window, input, controls */
            height: 100vh;
            background-color: #f0f0f0;
            color: #333;
            --bg-color: #000000;
            --text-color: #FFFFFF;
        }

        .teleprompter-window {
            flex-grow: 1; /* Takes up most vertical space */
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            position: relative;
            padding: 0 20px; /* Horizontal padding for vertical scroll */
            box-sizing: border-box;
            transition: transform 0.3s ease-in-out;
        }

        .teleprompter-window.mirrored {
            transform: scaleX(-1);
        }

        #teleprompterText {
            position: absolute;
            font-size: 48px; /* Default, updated by JS */
            line-height: 1.5;
            top: 100%;
            width: 100%;
            left: 50%;
            transform: translateX(-50%);
            box-sizing: border-box;
            white-space: pre-wrap;
            text-align: center;
        }

        .teleprompter-window.horizontal-mode #teleprompterText {
            top: 0px;
            left: 100%;
            right: auto;
            width: max-content !important;
            white-space: nowrap !important;
            text-align: left !important;
            padding: 0;
            transform: none !important;
        }
        .teleprompter-window.horizontal-mode {
            padding: 0;
        }

        #scriptInput {
            width: calc(100% - 20px);
            height: 80px;
            margin: 10px 10px 5px 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            flex-shrink: 0;
            background-color: #fff;
        }

        .controls {
            padding: 10px 15px 15px 15px;
            background-color: #e0e0e0;
            border-top: 1px solid #ccc;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .controls label, .controls .control-group label {
            margin-right: 5px;
        }
        .controls .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .controls input[type="range"] {
            vertical-align: middle;
        }

        .controls button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .controls button:hover {
            background-color: #0056b3;
        }

        .controls button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .inverted-colors {
            --bg-color: #FFFFFF;
            --text-color: #000000;
        }

        .teleprompter-window:-webkit-full-screen,
        .teleprompter-window:-moz-full-screen,
        .teleprompter-window:-ms-fullscreen,
        .teleprompter-window:fullscreen {
            padding-top: 0;
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <div class="teleprompter-window" id="teleprompterWindow">
        <div id="teleprompterText">Your script will appear here.</div>
    </div>

    <textarea id="scriptInput" placeholder="Paste your script here... Script will auto-load on change."></textarea>

    <div class="controls">
        <button id="loadScriptBtn">Load/Reload Script</button>
        <button id="startPauseBtn" disabled>Start (Space)</button>
        <button id="stopBtn" disabled>Stop & Reset (Shift)</button>

        <div class="control-group">
            <label for="speedRange">Speed:</label>
            <input type="range" id="speedRange" min="1" max="50" value="3.5" step="0.5">
            <span id="speedValue">5.0</span>
        </div>

        <div class="control-group">
            <label for="fontSizeRange">Font Size:</label>
            <input type="range" id="fontSizeRange" min="20" max="300" value="20">
            <span id="fontSizeValue">48px</span>
        </div>

        <div class="control-group" id="textWidthControlGroup">
            <label for="textWidthRange">Text Width:</label>
            <input type="range" id="textWidthRange" min="1" max="100" value="5">
            <span id="textWidthValue">100%</span>
        </div>

        <button id="scrollDirectionBtn">Scroll Right-to-Left</button>

        <div id="horizontalScrollSettings" class="control-group hidden">
            <label for="linePositionRange">Line Vertical Pos:</label>
            <input type="range" id="linePositionRange" min="0" max="100" value="0">
            <span id="linePositionValue">0px</span>
        </div>

        <button id="mirrorBtn">Mirror Display</button>
        <button id="invertColorsBtn">Invert Colors</button>
        <button id="fullscreenBtn">Fullscreen Display</button>
    </div>

    <script>
        const scriptInput = document.getElementById('scriptInput');
        const loadScriptBtn = document.getElementById('loadScriptBtn');
        const teleprompterText = document.getElementById('teleprompterText');
        const teleprompterWindow = document.getElementById('teleprompterWindow');

        const startPauseBtn = document.getElementById('startPauseBtn');
        const stopBtn = document.getElementById('stopBtn');

        const speedRange = document.getElementById('speedRange');
        const speedValue = document.getElementById('speedValue');
        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeValue = document.getElementById('fontSizeValue');

        const textWidthRange = document.getElementById('textWidthRange');
        const textWidthValue = document.getElementById('textWidthValue');
        const textWidthControlGroup = document.getElementById('textWidthControlGroup');

        const mirrorBtn = document.getElementById('mirrorBtn');
        const invertColorsBtn = document.getElementById('invertColorsBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const scrollDirectionBtn = document.getElementById('scrollDirectionBtn');
        const horizontalScrollSettings = document.getElementById('horizontalScrollSettings');
        const linePositionRange = document.getElementById('linePositionRange');
        const linePositionValue = document.getElementById('linePositionValue');

        let isScrolling = false;
        let animationFrameId = null;

        let currentTopPosition = 0;
        let currentLeftPosition = 0;

        let scrollSpeed = parseFloat(speedRange.value); // MODIFIED
        let initialFontSize = parseInt(fontSizeRange.value);
        let isHorizontalMode = false;

        const MANUAL_ADJUST_STEP = 50;

        function initializeTeleprompter() {
            teleprompterText.style.fontSize = `${initialFontSize}px`;
            fontSizeValue.textContent = `${initialFontSize}px`;
            speedValue.textContent = parseFloat(speedRange.value).toFixed(1); // MODIFIED

            textWidthValue.textContent = `${textWidthRange.value}%`;

            if (isHorizontalMode) {
                textWidthControlGroup.classList.add('hidden');
                horizontalScrollSettings.classList.remove('hidden');
            } else {
                textWidthControlGroup.classList.remove('hidden');
                horizontalScrollSettings.classList.add('hidden');
            }

            updateLinePositionSliderMax();
            linePositionRange.value = 0;
            linePositionValue.textContent = `0px`;
            loadScript();
        }

        function resetScrollPosition() {
            teleprompterText.style.transition = 'none';
            if (isHorizontalMode) {
                teleprompterText.style.top = `${linePositionRange.value}px`;
                currentLeftPosition = teleprompterWindow.clientWidth;
                teleprompterText.style.left = `${currentLeftPosition}px`;
            } else {
                currentTopPosition = teleprompterWindow.clientHeight;
                teleprompterText.style.top = `${currentTopPosition}px`;
            }
            void teleprompterText.offsetWidth;
        }

        function loadScript() {
            const script = scriptInput.value;
            stopScrolling();

            if (script.trim() === "") {
                teleprompterText.innerHTML = isHorizontalMode ? "Please load a script..." : "<p>Please load a script first.</p>";
                startPauseBtn.disabled = true;
                stopBtn.disabled = true;
            } else {
                if (isHorizontalMode) {
                    const singleLineScript = script.split('\n').join('   \u2022   ');
                    teleprompterText.textContent = singleLineScript;
                    teleprompterText.style.textAlign = 'left';
                    teleprompterText.style.padding = '0';
                    teleprompterText.style.width = 'max-content';
                    teleprompterText.style.transform = 'none';
                    teleprompterText.style.left = 'auto';
                    teleprompterText.style.whiteSpace = 'nowrap';
                } else {
                    teleprompterText.innerHTML = script.split('\n').map(line => `<p>${line || ' '}</p>`).join('');
                    teleprompterText.style.textAlign = 'center';
                    teleprompterText.style.padding = '';
                    teleprompterText.style.width = `${textWidthRange.value}%`;
                    teleprompterText.style.left = '50%';
                    teleprompterText.style.transform = 'translateX(-50%)';
                    teleprompterText.style.whiteSpace = 'pre-wrap';
                }
                startPauseBtn.disabled = false;
                stopBtn.disabled = false;
            }

            updateLinePositionSliderMax();
            resetScrollPosition();
        }

        function scrollLoop() {
            if (!isScrolling) return;

            if (isHorizontalMode) {
                currentLeftPosition -= (scrollSpeed / 10);
                teleprompterText.style.left = `${currentLeftPosition}px`;
                if (teleprompterText.offsetLeft + teleprompterText.scrollWidth < 0) {
                    stopScrolling();
                } else {
                    animationFrameId = requestAnimationFrame(scrollLoop);
                }
            } else {
                currentTopPosition -= (scrollSpeed / 10);
                teleprompterText.style.top = `${currentTopPosition}px`;
                if (teleprompterText.offsetTop + teleprompterText.offsetHeight < 0) {
                    stopScrolling();
                } else {
                    animationFrameId = requestAnimationFrame(scrollLoop);
                }
            }
        }

        function startScrolling() {
            if (startPauseBtn.disabled) return;
            isScrolling = true;
            startPauseBtn.textContent = 'Pause (Space)';
            animationFrameId = requestAnimationFrame(scrollLoop);
        }

        function pauseScrolling() {
            isScrolling = false;
            startPauseBtn.textContent = 'Resume (Space)';
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
        }

        function stopScrolling() {
            isScrolling = false;
            startPauseBtn.textContent = 'Start (Space)';
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            resetScrollPosition();
        }

        function updateLinePositionSliderMax() {
            if (isHorizontalMode) {
                const textLineHeight = teleprompterText.offsetHeight || parseFloat(teleprompterText.style.fontSize || initialFontSize) * 1.5;
                const maxTop = Math.max(0, teleprompterWindow.clientHeight - textLineHeight);
                linePositionRange.max = maxTop;
                if (parseInt(linePositionRange.value) > maxTop) {
                    linePositionRange.value = maxTop;
                }
                linePositionValue.textContent = `${linePositionRange.value}px`;
                 if (!isScrolling) teleprompterText.style.top = `${linePositionRange.value}px`;
            }
        }

        // --- Event Listeners ---
        loadScriptBtn.addEventListener('click', loadScript);
        scriptInput.addEventListener('input', loadScript);

        startPauseBtn.addEventListener('click', () => {
            if (isScrolling) {
                pauseScrolling();
            } else {
                startScrolling();
            }
        });

        stopBtn.addEventListener('click', stopScrolling);

        speedRange.addEventListener('input', (e) => {
            scrollSpeed = parseFloat(e.target.value); // MODIFIED
            speedValue.textContent = parseFloat(e.target.value).toFixed(1); // MODIFIED
        });

        fontSizeRange.addEventListener('input', (e) => {
            const newSize = parseInt(e.target.value);
            teleprompterText.style.fontSize = `${newSize}px`;
            fontSizeValue.textContent = `${newSize}px`;
            updateLinePositionSliderMax();
            if (!isScrolling) resetScrollPosition();
        });

        textWidthRange.addEventListener('input', (e) => {
            if (isHorizontalMode) return;

            const newWidth = e.target.value;
            teleprompterText.style.width = `${newWidth}%`;
            textWidthValue.textContent = `${newWidth}%`;
            if (!isScrolling) {
                resetScrollPosition();
            }
        });

        mirrorBtn.addEventListener('click', () => {
            teleprompterWindow.classList.toggle('mirrored');
        });

        invertColorsBtn.addEventListener('click', () => {
            document.body.classList.toggle('inverted-colors');
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                teleprompterWindow.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        scrollDirectionBtn.addEventListener('click', () => {
            isHorizontalMode = !isHorizontalMode;
            if (isHorizontalMode) {
                scrollDirectionBtn.textContent = 'Scroll Vertically';
                horizontalScrollSettings.classList.remove('hidden');
                textWidthControlGroup.classList.add('hidden');
                teleprompterWindow.classList.add('horizontal-mode');
                teleprompterText.style.transform = 'none';
                teleprompterText.style.width = 'max-content';
                teleprompterText.style.left = 'auto';
            } else {
                scrollDirectionBtn.textContent = 'Scroll Right-to-Left';
                horizontalScrollSettings.classList.add('hidden');
                textWidthControlGroup.classList.remove('hidden');
                teleprompterWindow.classList.remove('horizontal-mode');
                teleprompterText.style.width = `${textWidthRange.value}%`;
                teleprompterText.style.left = '50%';
                teleprompterText.style.transform = 'translateX(-50%)';
            }
            loadScript();
        });

        linePositionRange.addEventListener('input', (e) => {
            const newPos = e.target.value;
            linePositionValue.textContent = `${newPos}px`;
            if (isHorizontalMode) {
                teleprompterText.style.top = `${newPos}px`;
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.target === scriptInput) return;

            if (e.code === 'Space') {
                e.preventDefault();
                if (!startPauseBtn.disabled) startPauseBtn.click();
            } else if (e.key === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                e.preventDefault();
                if (!stopBtn.disabled) stopBtn.click();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (isScrolling) pauseScrolling();
                if (isHorizontalMode) {
                    currentLeftPosition += MANUAL_ADJUST_STEP;
                    teleprompterText.style.left = `${currentLeftPosition}px`;
                } else {
                    currentTopPosition += MANUAL_ADJUST_STEP;
                    teleprompterText.style.top = `${currentTopPosition}px`;
                }
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (isScrolling) pauseScrolling();
                if (isHorizontalMode) {
                    currentLeftPosition -= MANUAL_ADJUST_STEP;
                    teleprompterText.style.left = `${currentLeftPosition}px`;
                } else {
                    currentTopPosition -= MANUAL_ADJUST_STEP;
                    teleprompterText.style.top = `${currentTopPosition}px`;
                }
            }
        });

        window.addEventListener('resize', () => {
            updateLinePositionSliderMax();
            if (!isScrolling) resetScrollPosition();
        });

        document.addEventListener('fullscreenchange', () => {
            updateLinePositionSliderMax();
            if (!isScrolling) resetScrollPosition();
        });

        initializeTeleprompter();
        setTimeout(() => {
            updateLinePositionSliderMax();
            if (!isScrolling) resetScrollPosition();
        }, 100);

    </script>
</body>
</html>
