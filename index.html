<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibrato Master</title>
<style>
    :root {
        --bg: #f8f9fa;
        --card-bg: #ffffff;
        --text: #212529;
        --accent: #000000;
        --success: #28a745;
        --error: #dc3545;
        --p1: #007bff;
        --p2: #d63384;
        --radius: 16px;
        --shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
        overflow-x: hidden;
    }

    /* Confetti Canvas */
    #confetti-canvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 100;
    }

    .game-container {
        background: var(--card-bg);
        padding: 30px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 420px;
        text-align: center;
        position: relative;
        overflow: hidden;
        transition: transform 0.2s;
    }

    h1 { margin: 0 0 5px 0; font-size: 1.8rem; letter-spacing: -1px; font-weight: 800; }
    h2 { margin: 0 0 25px 0; font-size: 0.95rem; color: #868e96; font-weight: 500; text-transform: uppercase; letter-spacing: 1px;}

    .stats-bar {
        display: flex; justify-content: space-between; margin-bottom: 25px;
        font-size: 0.95rem; font-weight: 700; color: #adb5bd;
        background: #f1f3f5; padding: 10px 15px; border-radius: 10px;
    }
    .stats-bar.multi { color: var(--text); }

    .play-section {
        display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 25px;
    }

    .play-wrapper { position: relative; }

    .listen-btn {
        width: 90px; height: 90px; border-radius: 50%;
        background: var(--accent); border: none; color: white;
        font-size: 1.5rem; cursor: pointer;
        transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .listen-btn:active { transform: scale(0.92); }
    .listen-btn.playing { background-color: #343a40; box-shadow: 0 0 0 4px rgba(0,0,0,0.1); }

    /* Calibrate Button */
    .calibrate-btn {
        position: absolute; top: 0; right: -40px;
        width: 30px; height: 30px; border-radius: 50%;
        background: #e9ecef; color: #495057; border: none;
        font-weight: bold; cursor: pointer; font-size: 0.8rem;
    }
    .calibrate-btn:hover { background: #dee2e6; }

    .toggle-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

    .pill-toggle {
        background: white; border: 1px solid #ced4da; padding: 6px 14px;
        border-radius: 20px; font-size: 0.75rem; cursor: pointer; color: #495057;
        transition: all 0.2s; font-weight: 600;
    }
    .pill-toggle:hover { background: #f8f9fa; }
    .pill-toggle.active { background-color: var(--accent); color: white; border-color: var(--accent); }
    .pill-toggle.sound-btn.active { background-color: #fd7e14; border-color: #fd7e14; }

    .icon { width: 32px; height: 32px; fill: white; }

    .options-grid { display: grid; gap: 12px; margin-bottom: 20px; }

    /* Inputs */
    .insane-inputs { display: flex; flex-direction: column; gap: 15px; text-align: left; }
    .insane-inputs label { font-size: 0.85rem; font-weight: 700; color: #495057; text-transform: uppercase; }
    .insane-inputs input {
        width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 8px;
        font-size: 1.1rem; box-sizing: border-box; margin-top: 5px; outline: none;
        transition: border-color 0.2s; font-family: monospace;
    }
    .insane-inputs input:focus { border-color: var(--accent); }

    .turn-indicator {
        font-weight: 800; margin-bottom: 10px; display: block;
        text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1.5px;
    }
    .p1-turn { color: var(--p1); }
    .p2-turn { color: var(--p2); }

    .option-btn {
        background: white; border: 2px solid #f1f3f5; padding: 16px;
        border-radius: 12px; font-size: 1rem; cursor: pointer; transition: all 0.2s;
        font-weight: 600; color: #495057;
    }
    .option-btn:hover { border-color: #ced4da; transform: translateY(-2px); }
    .option-btn:active { background-color: #f8f9fa; transform: translateY(0); }

    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 25px; border-top: 1px solid #f1f3f5; padding-top: 20px; }

    select, .action-btn {
        padding: 12px 20px; border-radius: 8px; border: 1px solid #ced4da;
        background: white; font-size: 0.9rem; cursor: pointer; font-weight: 600;
    }
    .action-btn { background: var(--accent); color: white; border: none; flex-grow: 1; }
    .action-btn:hover { background: #333; }

    /* Share Button */
    .share-btn {
        background: #25D366; color: white; border: none; padding: 12px 25px;
        border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer;
        margin-top: 15px; display: inline-flex; align-items: center; gap: 8px;
    }
    .share-btn:hover { background: #20ba5a; }

    /* Overlay */
    .overlay {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255,255,255,0.98);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 25px; z-index: 10;
        backdrop-filter: blur(5px);
    }
    .overlay.visible { opacity: 1; pointer-events: all; }
    .overlay h3 { font-size: 2.2rem; margin: 0 0 15px 0; font-weight: 900; letter-spacing: -1px; }
    
    .overlay .btn-next {
        background: var(--accent); color: white; border: none;
        padding: 14px 40px; font-size: 1.1rem; border-radius: 30px; cursor: pointer;
        font-weight: 700; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .overlay.pass-device { background: #212529; }
    .overlay.pass-device h3 { color: white; }
    .overlay.pass-device p { color: #adb5bd; }
    .overlay.pass-device .btn-next { background: white; color: black; }

    .mp-results-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-bottom: 25px;
    }
    .mp-card {
        background: #f8f9fa; padding: 15px; border-radius: 12px; font-size: 0.9rem; border: 2px solid transparent;
    }
    .mp-card.winner { border-color: #ffd43b; background: #fff9db; }
    .mp-score-text { font-size: 1.4rem; font-weight: 800; display: block; margin-top: 8px; }

    .high-scores { margin-top: 30px; font-size: 0.85rem; color: #868e96; width: 100%; max-width: 420px; }
    .high-scores ol { padding-left: 20px; margin-top: 10px; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .new-record { color: #e64980; animation: pulse 1s infinite; font-weight: 800; display: block; margin-top: 15px; font-size: 1.1rem; }

</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="game-container">
    <h1>Vibrato Master</h1>
    <h2 id="difficulty-label">Difficulty: Medium</h2>

    <div class="stats-bar" id="stats-bar">
        <span id="round-display">Round: 1/5</span>
        <span id="score-display">Score: 0</span>
    </div>

    <div class="play-section">
        <div class="play-wrapper">
            <button id="listen-btn" class="listen-btn" aria-label="Play Sound">
                <svg id="icon-play" class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-stop" class="icon" viewBox="0 0 24 24" style="display:none"><path d="M6 6h12v12H6z"/></svg>
            </button>
            <button id="calibrate-btn" class="calibrate-btn" title="Hear Reference (5Hz)">?</button>
        </div>
        
        <div class="toggle-row">
            <button id="metro-toggle" class="pill-toggle">Metronome</button>
            <button id="multi-toggle" class="pill-toggle">2 Players</button>
            <button id="sound-toggle" class="pill-toggle sound-btn">Sine</button>
        </div>
        
        <div style="font-size: 0.75rem; color: #adb5bd; margin-top: 8px; font-weight: 500;">BASE PITCH: A4 (442Hz)</div>
    </div>

    <div id="options-container" class="options-grid"></div>

    <div class="controls">
        <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="insane">Insane</option>
        </select>
        <button id="restart-btn" class="action-btn">Restart</button>
    </div>

    <!-- Feedback Overlay -->
    <div id="feedback-overlay" class="overlay">
        <h3 id="feedback-title">Correct!</h3>
        <div id="feedback-content"></div>
        <button id="next-round-btn" class="btn-next">Next Round</button>
        <div id="share-container"></div>
    </div>
</div>

<div class="high-scores" id="hs-container">
    <strong id="highscore-title">🏆 Top 3 High Scores (Medium):</strong>
    <ol id="highscore-list"></ol>
</div>

<script>
/**
 * --- CONFETTI ENGINE ---
 */
const confettiCtx = document.getElementById('confetti-canvas').getContext('2d');
let confettiParticles = [];
document.getElementById('confetti-canvas').width = window.innerWidth;
document.getElementById('confetti-canvas').height = window.innerHeight;

function fireConfetti() {
    for (let i = 0; i < 100; i++) {
        confettiParticles.push({
            x: window.innerWidth / 2, y: window.innerHeight / 2,
            r: Math.random() * 6 + 2, dx: Math.random() * 10 - 5, dy: Math.random() * 10 - 5,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`, life: 100
        });
    }
    requestAnimationFrame(updateConfetti);
}

function updateConfetti() {
    confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    confettiParticles.forEach((p, i) => {
        p.x += p.dx; p.y += p.dy; p.life--; p.dy += 0.2; // Gravity
        confettiCtx.beginPath(); confettiCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        confettiCtx.fillStyle = p.color; confettiCtx.fill();
        if (p.life <= 0) confettiParticles.splice(i, 1);
    });
    if (confettiParticles.length > 0) requestAnimationFrame(updateConfetti);
}

/**
 * --- AUDIO ENGINE ---
 */
const workletCode = `
class VibratoProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [
      { name: 'baseFrequency', defaultValue: 442, minValue: 20, maxValue: 20000 },
      { name: 'depth', defaultValue: 50, minValue: 0, maxValue: 200 },
      { name: 'rate', defaultValue: 5.0, minValue: 0.1, maxValue: 20 },
      { name: 'waveType', defaultValue: 0, minValue: 0, maxValue: 1 } // 0=Sine, 1=Cello
    ];
  }

  constructor() {
    super();
    this.carrierPhase = 0;
    this.lfoPhase = 0;
    this.previousInstantaneousFreq = 0;
    this.startTime = -1;
    this.port.onmessage = (e) => { if (e.data.startTime !== undefined) this.startTime = e.data.startTime; };
  }

  process(inputs, outputs, parameters) {
    const output = outputs[0][0];
    const bufferLength = output.length;
    
    if (this.startTime !== -1 && currentTime < this.startTime) { output.fill(0); return true; }

    const baseFreqParams = parameters.baseFrequency;
    const depthParams = parameters.depth;
    const rateParams = parameters.rate;
    const waveTypeParam = parameters.waveType;
    const twoPi = 2 * Math.PI;
    const inverseSampleRate = 1 / sampleRate;

    for (let i = 0; i < bufferLength; ++i) {
      const currentBaseFreq = baseFreqParams.length > 1 ? baseFreqParams[i] : baseFreqParams[0];
      const currentDepth = depthParams.length > 1 ? depthParams[i] : depthParams[0];
      const currentRate = rateParams.length > 1 ? rateParams[i] : rateParams[0];
      const isCello = (waveTypeParam.length > 1 ? waveTypeParam[i] : waveTypeParam[0]) > 0.5;

      const calibrationFactor = 1.0 + (currentRate * 0.005);
      const effectiveDepth = currentDepth * calibrationFactor;
      const lfoValue = Math.sin(this.lfoPhase * twoPi);
      const frequencyMultiplier = Math.pow(2, (lfoValue * effectiveDepth) / 1200);
      const targetInstantaneousFreq = currentBaseFreq * frequencyMultiplier;

      if (this.previousInstantaneousFreq === 0) this.previousInstantaneousFreq = targetInstantaneousFreq;
      const averageFreq = (this.previousInstantaneousFreq + targetInstantaneousFreq) / 2;
      this.carrierPhase += averageFreq * inverseSampleRate;
      this.previousInstantaneousFreq = targetInstantaneousFreq;

      if (this.carrierPhase >= 1.0) this.carrierPhase -= 1.0;
      
      let sample = 0;
      if (isCello) {
          // Approximation of a string (Sawtooth with simple smoothing)
          let rawSaw = 2.0 * (this.carrierPhase - 0.5);
          sample = rawSaw * 0.6; // Slightly quieter
      } else {
          sample = Math.sin(this.carrierPhase * twoPi);
      }
      
      output[i] = sample;

      this.lfoPhase += currentRate * inverseSampleRate;
      if (this.lfoPhase >= 1.0) this.lfoPhase -= 1.0;
    }
    return true;
  }
}
registerProcessor('vibrato-processor', VibratoProcessor);
`;

let audioContext = null;
let vibratoNode = null;
let gainNode = null;
let metronomeGainNode = null;
let isPlaying = false;
let isMetronomeOn = false;
let isMultiplayer = false;
let soundType = 0; // 0 = Sine, 1 = Cello
let metronomeInterval = null;

const NOTE_GAIN = 0.60;
const CLICK_GAIN = 0.25;
const FADE_TIME = 0.05;
const SYNC_DELAY = 0.1;
const METRO_BPM = 60;

// Game State
const MAX_ROUNDS = 5;
let currentRound = 1;
let currentScore = 0;
let currentDifficulty = 'medium';
let targetValues = { rate: 0, depth: 0 };
let currentOptions = [];
let gameState = 'waiting'; 
let activePlayer = 1;
let p1Score = 0;
let p2Score = 0;
let p1Guess = null;

// High Scores
const defaultScores = { easy: [0,0,0], medium: [0,0,0], hard: [0,0,0], insane: [0,0,0] };
let highScores = defaultScores;
try {
    const saved = localStorage.getItem('vibratoHighScores');
    if (saved) {
        highScores = JSON.parse(saved);
        if (!highScores.insane) highScores.insane = [0,0,0];
    }
} catch (e) { highScores = defaultScores; }

// Elements
const listenBtn = document.getElementById('listen-btn');
const calibrateBtn = document.getElementById('calibrate-btn');
const metroToggle = document.getElementById('metro-toggle');
const multiToggle = document.getElementById('multi-toggle');
const soundToggle = document.getElementById('sound-toggle');
const iconPlay = document.getElementById('icon-play');
const iconStop = document.getElementById('icon-stop');
const optionsContainer = document.getElementById('options-container');
const roundDisplay = document.getElementById('round-display');
const scoreDisplay = document.getElementById('score-display');
const difficultySelect = document.getElementById('difficulty-select');
const difficultyLabel = document.getElementById('difficulty-label');
const restartBtn = document.getElementById('restart-btn');
const overlay = document.getElementById('feedback-overlay');
const feedbackTitle = document.getElementById('feedback-title');
const feedbackContent = document.getElementById('feedback-content');
const nextRoundBtn = document.getElementById('next-round-btn');
const shareContainer = document.getElementById('share-container');
const highscoreList = document.getElementById('highscore-list');
const highscoreTitle = document.getElementById('highscore-title');
const hsContainer = document.getElementById('hs-container');
const statsBar = document.getElementById('stats-bar');

// --- AUDIO LOGIC ---
async function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        await audioContext.audioWorklet.addModule(url);
    }
    if (audioContext.state === 'suspended') await audioContext.resume();
}

function createMetronomePath() {
    if (!metronomeGainNode) {
        metronomeGainNode = audioContext.createGain();
        metronomeGainNode.gain.value = CLICK_GAIN;
        metronomeGainNode.connect(audioContext.destination);
    }
}

function scheduleClick(time) {
    createMetronomePath();
    const clickOsc = audioContext.createOscillator();
    const clickGain = audioContext.createGain();
    clickOsc.type = 'sine';
    clickOsc.frequency.setValueAtTime(1768, time);
    clickGain.gain.setValueAtTime(1.0, time);
    clickGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    clickOsc.connect(clickGain);
    clickGain.connect(metronomeGainNode);
    clickOsc.start(time);
    clickOsc.stop(time + 0.05);
}

function startMetronomeLoop(startTime) {
    const interval = 60 / METRO_BPM;
    let nextClickTime = startTime; 
    function scheduler() {
        if (!isPlaying) return;
        while (nextClickTime < audioContext.currentTime + 0.1) {
            scheduleClick(nextClickTime);
            nextClickTime += interval;
        }
        metronomeInterval = setTimeout(scheduler, 25);
    }
    scheduler();
}

function cleanupMetronome() {
    clearTimeout(metronomeInterval);
    metronomeInterval = null;
}

function playSound(overrideValues = null, autoStop = false) {
    if (isPlaying) { stopSound(); return; }
    initAudio().then(() => {
        if (vibratoNode) { try { vibratoNode.disconnect(); } catch(e){} }
        if (gainNode) { try { gainNode.disconnect(); } catch(e){} }
        cleanupMetronome();

        vibratoNode = new AudioWorkletNode(audioContext, 'vibrato-processor');
        gainNode = audioContext.createGain();
        vibratoNode.connect(gainNode);
        gainNode.connect(audioContext.destination);

        const params = vibratoNode.parameters;
        params.get('baseFrequency').setValueAtTime(442, audioContext.currentTime);
        
        // Use override for calibration or current game values
        const rate = overrideValues ? overrideValues.rate : targetValues.rate;
        const depth = overrideValues ? overrideValues.depth : targetValues.depth;

        params.get('rate').setValueAtTime(rate, audioContext.currentTime);
        params.get('depth').setValueAtTime(depth, audioContext.currentTime);
        params.get('waveType').setValueAtTime(soundType, audioContext.currentTime);

        const now = audioContext.currentTime;
        const startTime = now + SYNC_DELAY; 

        vibratoNode.port.postMessage({ startTime: startTime });

        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(NOTE_GAIN, startTime + FADE_TIME);

        isPlaying = true;
        if (!overrideValues) updatePlayButtonState(); // Don't change main button for calibration

        if (isMetronomeOn && !overrideValues) startMetronomeLoop(startTime);

        if (autoStop) {
            setTimeout(() => stopSound(true), 1500); // Stop calibration after 1.5s
        }
    });
}

function stopSound(isCalibration = false) {
    if (!isPlaying) return;
    cleanupMetronome();
    if (gainNode) {
        const now = audioContext.currentTime;
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(0, now + FADE_TIME);
    }
    setTimeout(() => {
        if (vibratoNode) { vibratoNode.disconnect(); vibratoNode = null; }
        isPlaying = false;
        if (!isCalibration) updatePlayButtonState();
    }, (FADE_TIME * 1000) + 100);
}

function updatePlayButtonState() {
    if (isPlaying) {
        listenBtn.classList.add('playing');
        iconPlay.style.display = 'none';
        iconStop.style.display = 'block';
    } else {
        listenBtn.classList.remove('playing');
        iconPlay.style.display = 'block';
        iconStop.style.display = 'none';
    }
}

// --- GAME LOGIC ---

function updateHighScoresDisplay() {
    if (isMultiplayer) { hsContainer.style.display = 'none'; return; }
    hsContainer.style.display = 'block';
    const diff = difficultySelect.value;
    const scores = highScores[diff] || [0,0,0];
    const diffName = diff.charAt(0).toUpperCase() + diff.slice(1);
    highscoreTitle.textContent = `🏆 Top 3 Scores (${diffName}):`;
    highscoreList.innerHTML = scores.map(score => `<li>${score} pts</li>`).join('');
}

function getRandom(min, max, decimals = 0) {
    const val = Math.random() * (max - min) + min;
    return parseFloat(val.toFixed(decimals));
}

function generateTarget() {
    const rate = getRandom(4, 7, 1);
    const depth = getRandom(11, 44, 0);
    return { rate, depth };
}

function generateOptions(target, difficulty) {
    if (difficulty === 'insane') return [];
    let opts = [target];
    let rateDev, depthDev;
    if (difficulty === 'easy') { rateDev = 1.5; depthDev = 15; }
    else if (difficulty === 'medium') { rateDev = 0.8; depthDev = 8; }
    else { rateDev = 0.3; depthDev = 4; }

    for (let i = 0; i < 2; i++) {
        let newOpt;
        let valid = false;
        let attempts = 0;
        while (!valid && attempts < 20) {
            attempts++;
            const rDir = Math.random() > 0.5 ? 1 : -1;
            const dDir = Math.random() > 0.5 ? 1 : -1;
            const rJitter = (Math.random() * 0.4) - 0.2; 
            const dJitter = Math.floor(Math.random() * 4) - 2;
            let r = parseFloat((target.rate + (rateDev + rJitter) * rDir).toFixed(1));
            let d = Math.round(target.depth + (depthDev + dJitter) * dDir);
            if (r < 4) r = 4; if (r > 7) r = 7;
            if (d < 11) d = 11; if (d > 44) d = 44;
            newOpt = { rate: r, depth: d };
            const exists = opts.some(o => o.rate === newOpt.rate && o.depth === newOpt.depth);
            const tooClose = Math.abs(newOpt.rate - target.rate) < 0.1 && Math.abs(newOpt.depth - target.depth) < 2;
            if (!exists && !tooClose) valid = true;
        }
        opts.push(newOpt);
    }
    return opts.sort(() => Math.random() - 0.5);
}

function startRound() {
    stopSound();
    gameState = 'playing';
    
    // Fairness Lock: Only generate new if it's Single Player OR P1's turn
    if (!isMultiplayer || (isMultiplayer && activePlayer === 1)) {
        targetValues = generateTarget();
        currentOptions = generateOptions(targetValues, currentDifficulty);
    }

    roundDisplay.textContent = `Round: ${currentRound}/${MAX_ROUNDS}`;
    
    if (isMultiplayer) {
        statsBar.classList.add('multi');
        scoreDisplay.innerHTML = `<span style="color:var(--p1)">P1: ${p1Score}</span> | <span style="color:var(--p2)">P2: ${p2Score}</span>`;
    } else {
        statsBar.classList.remove('multi');
        scoreDisplay.textContent = `Score: ${currentScore}`;
    }
    renderUI();
}

function renderUI() {
    optionsContainer.innerHTML = '';

    if (currentDifficulty === 'insane') {
        const insaneDiv = document.createElement('div');
        insaneDiv.className = 'insane-inputs';
        
        let turnHtml = '';
        let btnText = 'Submit Answer';
        
        if (isMultiplayer) {
            if (activePlayer === 1) {
                turnHtml = `<span class="turn-indicator p1-turn">Player 1's Turn</span>`;
                btnText = 'Submit (Player 1)';
            } else {
                turnHtml = `<span class="turn-indicator p2-turn">Player 2's Turn</span>`;
                btnText = 'Submit (Player 2)';
            }
        }

        insaneDiv.innerHTML = `
            ${turnHtml}
            <label>Speed (Hz): <input type="number" id="input-rate" step="0.1" placeholder="4.0 - 7.0"></label>
            <label>Amplitude (cents): <input type="number" id="input-depth" step="1" placeholder="11 - 44"></label>
            <button id="submit-insane" class="action-btn" style="width:100%; margin-top:10px; background-color: var(--accent);">${btnText}</button>
        `;
        optionsContainer.appendChild(insaneDiv);
        document.getElementById('submit-insane').addEventListener('click', handleInsaneGuess);
    } else {
        optionsContainer.className = 'options-grid';
        currentOptions.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = `Speed: ${opt.rate} Hz | Amp: ${opt.depth} cents`;
            btn.onclick = () => handleStandardGuess(opt);
            optionsContainer.appendChild(btn);
        });
    }
}

function showFeedback(title, content, type) {
    overlay.classList.remove('gameover', 'correct', 'wrong', 'pass-device');
    overlay.classList.add('visible');
    if (type) overlay.classList.add(type);
    
    feedbackTitle.textContent = title;
    feedbackContent.innerHTML = content;
    shareContainer.innerHTML = ''; // Clear share btn until end
}

function handleStandardGuess(selectedOption) {
    stopSound();
    const isCorrect = (selectedOption.rate === targetValues.rate && selectedOption.depth === targetValues.depth);

    if (isCorrect) {
        fireConfetti();
        let points = 10;
        if (currentDifficulty === 'medium') points = 20;
        if (currentDifficulty === 'hard') points = 30;
        currentScore += points;
        showFeedback("Correct!", "<p>Perfect pitch perception!</p>", "correct");
    } else {
        showFeedback("Wrong Answer", `<p>Correct: <strong>${targetValues.rate} Hz / ${targetValues.depth} cents</strong></p>`, "wrong");
    }
    scoreDisplay.textContent = `Score: ${currentScore}`;
    setupNextStep();
}

function calculateScore(userRate, userDepth) {
    const rateDiff = Math.abs(userRate - targetValues.rate);
    const rateErrorPct = rateDiff / targetValues.rate;
    let rateScore = 50 * (1 - rateErrorPct * 2);
    if (rateScore < 0) rateScore = 0;

    const depthDiff = Math.abs(userDepth - targetValues.depth);
    const depthErrorPct = depthDiff / targetValues.depth;
    let depthScore = 50 * (1 - depthErrorPct * 2);
    if (depthScore < 0) depthScore = 0;

    if (userRate === targetValues.rate) rateScore = 50;
    if (userDepth === targetValues.depth) depthScore = 50;

    return Math.round(rateScore + depthScore);
}

function handleInsaneGuess() {
    stopSound();
    const rateInput = document.getElementById('input-rate');
    const depthInput = document.getElementById('input-depth');
    
    if (!rateInput.value || !depthInput.value) { alert("Enter both values!"); return; }

    const userRate = parseFloat(rateInput.value);
    const userDepth = parseFloat(depthInput.value);
    
    if (isMultiplayer) {
        if (activePlayer === 1) {
            p1Guess = { rate: userRate, depth: userDepth };
            showFeedback("Switch Players", "<p>Pass device to <strong>Player 2</strong>.</p>", "pass-device");
            nextRoundBtn.textContent = "Player 2 Start";
            activePlayer = 2;
            gameState = 'switch_turn';
            return; 
        } else {
            const pts1 = calculateScore(p1Guess.rate, p1Guess.depth);
            const pts2 = calculateScore(userRate, userDepth);
            p1Score += pts1; p2Score += pts2;
            
            let resultMsg = pts1 > pts2 ? "Player 1 Wins!" : (pts2 > pts1 ? "Player 2 Wins!" : "Tie!");
            
            showFeedback(resultMsg, `
                <div class="mp-results-grid">
                    <div class="mp-card ${pts1 > pts2 ? 'winner' : ''}">
                        <div style="color:var(--p1); font-weight:bold;">Player 1</div>
                        <div>${p1Guess.rate}Hz / ${p1Guess.depth}c</div>
                        <span class="mp-score-text">+${pts1}</span>
                    </div>
                    <div class="mp-card ${pts2 > pts1 ? 'winner' : ''}">
                        <div style="color:var(--p2); font-weight:bold;">Player 2</div>
                        <div>${userRate}Hz / ${userDepth}c</div>
                        <span class="mp-score-text">+${pts2}</span>
                    </div>
                </div>
                <p>Correct: <strong>${targetValues.rate}Hz / ${targetValues.depth}c</strong></p>
            `, "correct");
            
            activePlayer = 1; 
        }
    } else {
        const pts = calculateScore(userRate, userDepth);
        currentScore += pts;
        let type = "wrong";
        if (pts >= 70) type = "correct";
        if (pts === 100) fireConfetti();

        showFeedback(pts === 100 ? "PERFECT!" : "Result", `
            <p>You earned <strong>${pts} points</strong>.</p>
            <p>Target: ${targetValues.rate}Hz / ${targetValues.depth}c<br>You: ${userRate}Hz / ${userDepth}c</p>
        `, type);
        scoreDisplay.textContent = `Score: ${currentScore}`;
    }
    setupNextStep();
}

function setupNextStep() {
    if (currentRound >= MAX_ROUNDS) {
        nextRoundBtn.textContent = "See Final Results";
        gameState = 'results';
    } else {
        nextRoundBtn.textContent = "Next Round";
        gameState = 'feedback';
    }
}

function endGame() {
    overlay.classList.remove('correct', 'wrong', 'pass-device');
    overlay.classList.add('gameover');
    feedbackTitle.textContent = "Game Over";
    shareContainer.innerHTML = '';
    
    if (isMultiplayer) {
        let winnerMsg = "";
        let finalHtml = "";
        if (p1Score > p2Score) {
            winnerMsg = "🏆 P1 Wins! 🏆";
            finalHtml = `<p>Player 2 needs to practice!</p>`;
            fireConfetti();
        } else if (p2Score > p1Score) {
            winnerMsg = "🏆 P2 Wins! 🏆";
            finalHtml = `<p>Player 1 has been dethroned!</p>`;
            fireConfetti();
        } else {
            winnerMsg = "It's a Draw!";
        }
        
        feedbackTitle.textContent = winnerMsg;
        feedbackContent.innerHTML = `
            <div style="display:flex; justify-content:center; gap:30px; margin-bottom:20px;">
                <div><h2 style="margin:0; font-size:2.5rem; color:var(--p1)">${p1Score}</h2><small>P1</small></div>
                <div><h2 style="margin:0; font-size:2.5rem; color:var(--p2)">${p2Score}</h2><small>P2</small></div>
            </div>
            ${finalHtml}
        `;
    } else {
        let msg = `<p>Final Score: <strong>${currentScore}</strong></p>`;
        const levelScores = highScores[currentDifficulty];
        levelScores.push(currentScore);
        levelScores.sort((a, b) => b - a);
        highScores[currentDifficulty] = levelScores.slice(0, 3);
        localStorage.setItem('vibratoHighScores', JSON.stringify(highScores));
        
        if (currentScore > 0 && highScores[currentDifficulty].includes(currentScore)) {
            msg += `<span class="new-record">🏆 NEW RECORD! 🏆</span>`;
            fireConfetti();
        }
        feedbackContent.innerHTML = msg;
        updateHighScoresDisplay();

        // SHARE BUTTON
        const shareBtn = document.createElement('button');
        shareBtn.className = 'share-btn';
        shareBtn.innerHTML = `<span>📤</span> Share Score`;
        shareBtn.onclick = () => {
            const text = `🎻 Vibrato Master\nMode: ${currentDifficulty.toUpperCase()}\nScore: ${currentScore}/500\nCan you beat my ear?`;
            navigator.clipboard.writeText(text).then(() => alert("Score copied to clipboard!"));
        };
        shareContainer.appendChild(shareBtn);
    }
    
    nextRoundBtn.textContent = "Play Again";
    gameState = 'gameover';
}

function restartGame() {
    currentRound = 1; currentScore = 0; p1Score = 0; p2Score = 0; activePlayer = 1;
    if (isMultiplayer) {
        difficultySelect.value = 'insane'; difficultySelect.disabled = true; 
        difficultyLabel.textContent = "Mode: Multiplayer (Insane)";
    } else {
        difficultySelect.disabled = false;
        currentDifficulty = difficultySelect.value;
        difficultyLabel.textContent = `Difficulty: ${currentDifficulty.charAt(0).toUpperCase() + currentDifficulty.slice(1)}`;
    }
    currentDifficulty = difficultySelect.value;
    updateHighScoresDisplay();
    overlay.classList.remove('visible', 'gameover');
    startRound();
}

// --- EVENTS ---
listenBtn.addEventListener('click', () => playSound());
calibrateBtn.addEventListener('click', () => playSound({rate: 5.0, depth: 25}, true));

metroToggle.addEventListener('click', () => {
    isMetronomeOn = !isMetronomeOn;
    metroToggle.classList.toggle('active', isMetronomeOn);
    if (isPlaying) { stopSound(); setTimeout(playSound, 150); }
});

multiToggle.addEventListener('click', () => {
    isMultiplayer = !isMultiplayer;
    multiToggle.classList.toggle('active', isMultiplayer);
    stopSound(); restartGame();
});

soundToggle.addEventListener('click', () => {
    soundType = soundType === 0 ? 1 : 0; // Toggle 0 (Sine) / 1 (Cello)
    soundToggle.textContent = soundType === 0 ? "Sine" : "Cello";
    soundToggle.classList.toggle('active', soundType === 1);
    if (isPlaying) { stopSound(); setTimeout(playSound, 150); }
});

nextRoundBtn.addEventListener('click', () => {
    if (gameState === 'results') endGame();
    else if (gameState === 'gameover') restartGame();
    else if (gameState === 'switch_turn') {
        overlay.classList.remove('visible', 'pass-device');
        renderUI();
    } else if (gameState === 'feedback') {
        if (currentRound < MAX_ROUNDS) { currentRound++; overlay.classList.remove('visible'); startRound(); }
        else endGame();
    }
});

restartBtn.addEventListener('click', () => { stopSound(); restartGame(); });
difficultySelect.addEventListener('change', () => { stopSound(); restartGame(); });

updateHighScoresDisplay();
startRound();

</script>
</body>
</html>
