<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vibrato Master</title>
<style>
    :root {
        --primary: #58cc02; /* Duo Green */
        --primary-dark: #46a302;
        --secondary: #1cb0f6; /* Duo Blue */
        --secondary-dark: #1899d6;
        --danger: #ff4b4b;
        --danger-dark: #d33131;
        --warning: #ffc800;
        --warning-dark: #e5b400;
        --gray: #e5e5e5;
        --gray-dark: #cecece;
        --text: #3c3c3c;
        --text-light: #777;
        --bg: #ffffff;
        --surface: #ffffff;
        --card-border: #e5e5e5;
        
        --radius: 16px;
        --btn-height: 50px;
        --header-height: 60px;
        --safe-top: env(safe-area-inset-top, 20px);
        --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #131f24;
            --surface: #202f36;
            --text: #ffffff;
            --text-light: #9faab0;
            --card-border: #37464f;
            --gray: #37464f;
            --gray-dark: #28373f;
        }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    body {
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden; /* Prevent pull-to-refresh */
        display: flex;
        flex-direction: column;
    }

    /* --- CANVAS --- */
    #effects-canvas {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 1000;
    }

    /* --- HEADER --- */
    .app-header {
        height: calc(var(--header-height) + var(--safe-top));
        padding-top: var(--safe-top);
        background: var(--bg);
        border-bottom: 2px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-left: 16px;
        padding-right: 16px;
        z-index: 10;
        flex-shrink: 0;
    }

    .stat-badge {
        display: flex; align-items: center; gap: 6px;
        font-weight: 800; font-size: 0.95rem;
    }
    .icon-heart { color: var(--danger); fill: currentColor; }
    .icon-gem { color: var(--secondary); fill: currentColor; }
    .icon-fire { color: var(--warning); fill: currentColor; }

    /* --- VIEWS --- */
    .view-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        padding-bottom: calc(var(--safe-bottom) + 80px); /* Space for bottom sheet */
        display: none;
        flex-direction: column;
        align-items: center;
    }
    .view-container.active { display: flex; }

    /* --- HOME / PATH --- */
    .level-path {
        display: flex; flex-direction: column; gap: 20px; align-items: center; width: 100%; max-width: 400px;
    }
    
    .level-node {
        width: 100%;
        background: var(--surface);
        border: 2px solid var(--card-border);
        border-radius: var(--radius);
        padding: 15px;
        display: flex;
        align-items: center;
        gap: 15px;
        cursor: pointer;
        transition: transform 0.1s;
        position: relative;
    }
    .level-node:active { transform: scale(0.98); background-color: var(--gray); }
    .level-node.locked { opacity: 0.6; filter: grayscale(1); pointer-events: none; }
    
    .level-icon {
        width: 50px; height: 50px;
        background: var(--primary);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        color: white;
        box-shadow: 0 4px 0 var(--primary-dark);
        font-size: 1.2rem;
    }
    .level-node.completed .level-icon { background: var(--warning); box-shadow: 0 4px 0 var(--warning-dark); }
    
    .level-info h3 { margin: 0; font-size: 1.1rem; }
    .level-info p { margin: 4px 0 0 0; font-size: 0.85rem; color: var(--text-light); }

    /* --- GAME VIEW --- */
    .game-header { width: 100%; max-width: 500px; margin-bottom: 20px; }
    .progress-bar-bg {
        width: 100%; height: 16px; background: var(--card-border); border-radius: 8px; overflow: hidden;
    }
    .progress-fill {
        height: 100%; background: var(--primary); width: 0%;
        transition: width 0.3s cubic-bezier(0.4, 1, 0.7, 0.93);
    }

    .listen-circle {
        width: 120px; height: 120px;
        border-radius: 50%;
        background: var(--secondary);
        box-shadow: 0 6px 0 var(--secondary-dark);
        border: none;
        color: white;
        margin: 20px 0;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: transform 0.1s, margin-top 0.1s;
    }
    .listen-circle:active { transform: translateY(6px); box-shadow: none; margin-bottom: 26px; }
    .listen-circle.playing { background: var(--text); box-shadow: 0 6px 0 black; }
    .listen-circle svg { width: 50px; height: 50px; fill: white; }

    .options-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        width: 100%; max-width: 500px;
    }
    
    .game-btn {
        background: var(--surface);
        border: 2px solid var(--card-border);
        border-bottom-width: 4px;
        border-radius: var(--radius);
        padding: 15px;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
        cursor: pointer;
        transition: all 0.1s;
    }
    .game-btn:active { border-bottom-width: 2px; transform: translateY(2px); }
    .game-btn.selected { border-color: var(--secondary); background: #eefaff; color: var(--secondary); }
    .game-btn.correct { border-color: var(--primary); background: #dfffd6; color: var(--primary); }
    .game-btn.wrong { border-color: var(--danger); background: #ffeaea; color: var(--danger); }

    /* --- BOTTOM SHEET (FEEDBACK) --- */
    .bottom-sheet {
        position: fixed; bottom: 0; left: 0; width: 100%;
        background: var(--surface);
        padding: 20px;
        padding-bottom: max(20px, var(--safe-bottom));
        border-top: 2px solid var(--card-border);
        transform: translateY(110%);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 100;
        display: flex; flex-direction: column; gap: 10px;
    }
    .bottom-sheet.visible { transform: translateY(0); }
    .bottom-sheet.correct { background: #d7ffb8; border-color: #b8f28b; color: #58a700; }
    .bottom-sheet.wrong { background: #ffdfe0; border-color: #ffc1c1; color: #ea2b2b; }

    .sheet-title { font-weight: 900; font-size: 1.5rem; margin: 0; display: flex; align-items: center; gap: 10px; }
    .sheet-msg { font-size: 1rem; margin-bottom: 10px; }

    .action-btn {
        width: 100%;
        padding: 14px;
        border-radius: var(--radius);
        border: none;
        font-size: 1.1rem;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        color: white;
        background: var(--primary);
        box-shadow: 0 4px 0 var(--primary-dark);
    }
    .action-btn:active { transform: translateY(4px); box-shadow: none; }
    .action-btn.secondary { background: var(--card-border); color: var(--text); box-shadow: 0 4px 0 var(--gray-dark); }
    .sheet-btn.correct { background: var(--primary); box-shadow: 0 4px 0 var(--primary-dark); }
    .sheet-btn.wrong { background: var(--danger); box-shadow: 0 4px 0 var(--danger-dark); }

    /* --- SHOP VIEW --- */
    .shop-item {
        width: 100%; max-width: 400px;
        background: var(--surface); border: 2px solid var(--card-border);
        border-radius: var(--radius); padding: 15px;
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 15px;
    }
    .price-tag { color: var(--secondary); font-weight: 800; display: flex; align-items: center; gap: 4px; }

    /* --- MODAL (Game Over) --- */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); z-index: 200;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .modal-card {
        background: var(--surface); width: 90%; max-width: 350px;
        padding: 24px; border-radius: var(--radius);
        text-align: center;
        transform: scale(0.8); transition: transform 0.2s;
    }
    .modal-overlay.visible .modal-card { transform: scale(1); }

    /* Animations */
    @keyframes pop { 50% { transform: scale(1.2); } }
    .pop-anim { animation: pop 0.3s; }
</style>
</head>
<body>

<!-- Canvas for Effects -->
<canvas id="effects-canvas"></canvas>

<!-- Top Stats Bar -->
<div class="app-header">
    <div class="stat-badge" onclick="goHome()">
        <span style="font-size:1.2rem">🎻</span>
    </div>
    <div class="stat-badge" id="streak-display">
        <svg class="icon-fire" width="20" height="20" viewBox="0 0 24 24"><path d="M12 23a7.5 7.5 0 0 1-5.138-12.963C8.204 8.774 11.5 6.5 11 1.5c6 4 9 8 3 14 1 0 2.5 0 5-2.47.27.773.5 1.604.5 2.47A7.5 7.5 0 0 1 12 23z"/></svg>
        <span id="streak-val">0</span>
    </div>
    <div class="stat-badge" id="gem-display">
        <svg class="icon-gem" width="20" height="20" viewBox="0 0 24 24"><path d="M12 2l-9.58 6.96 3.02 13.04h13.12l3.02-13.04z"/></svg>
        <span id="gem-val">0</span>
    </div>
    <div class="stat-badge" id="heart-display" onclick="openShop()">
        <svg class="icon-heart" width="20" height="20" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span id="heart-val">5</span>
    </div>
</div>

<!-- View: HOME / PATH -->
<div id="home-view" class="view-container active">
    <div class="level-path" id="level-list">
        <!-- Generated via JS -->
    </div>
    <div style="margin-top: 30px; text-align: center; color: var(--text-light); font-size: 0.8rem;">
        Complete levels to earn XP and Gems.<br>Don't lose your streak!
    </div>
</div>

<!-- View: GAME -->
<div id="game-view" class="view-container">
    <div class="game-header">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="game-progress"></div>

    <div style="text-align:center; font-weight:800; font-size:1.2rem; margin-bottom:10px;">

    </div>

    <button id="listen-btn" class="listen-circle">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

    </button>
    
    <div style="font-size:0.9rem; color:var(--text-light); margin-bottom:20px;">Reference: A4 (442Hz)</div>

    <div id="options-container" class="options-grid"></div>
</div>

<!-- View: SHOP -->
<div id="shop-view" class="view-container">
    <h2 style="align-self: flex-start;">Shop</h2>
    
    <div class="shop-item">
        <div>
            <div style="font-weight:bold; font-size:1.1rem">Refill Hearts</div>
            <div style="font-size:0.9rem; color:var(--text-light)">Restore to full health</div>
        </div>
        <button class="action-btn" style="width: auto; padding: 10px 20px; background: var(--secondary); box-shadow: 0 4px 0 var(--secondary-dark);" onclick="buyHearts()">
            <div class="price-tag"><span style="color:white">350</span> 💎</div>
        </button>
    </div>

    <div class="shop-item">
        <div>
            <div style="font-weight:bold; font-size:1.1rem">Streak Freeze</div>
            <div style="font-size:0.9rem; color:var(--text-light)">Protect your streak for one day</div>
        </div>
        <button class="action-btn secondary" style="width: auto; padding: 10px 20px;" disabled>
            <div class="price-tag">Equipped</div>
        </button>

    <button class="action-btn secondary" style="margin-top:20px;" onclick="goHome()">Back to Home</button>
</div>

<!-- Bottom Sheet (Feedback) -->
<div id="feedback-sheet" class="bottom-sheet">
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-msg" id="sheet-msg"></div>
    <button id="sheet-btn" class="action-btn sheet-btn">Continue</button>
</div>

<!-- Modal (Game Over / Level Complete) -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <h2 id="modal-title">Out of Hearts!</h2>
        <p id="modal-msg" style="color: var(--text-light); margin-bottom: 20px;">You made too many mistakes.</p>
        <button id="modal-btn" class="action-btn" onclick="closeModal()">Go to Shop</button>
    </div>
</div>

<script>
/* =========================================
   AUDIO ENGINE (AudioWorklet)
   ========================================= */
const workletCode = `
class VibratoProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [
      { name: 'baseFrequency', defaultValue: 442 },
      { name: 'depth', defaultValue: 20 },
      { name: 'rate', defaultValue: 5.0 }
    ];
  }
  constructor() {
    super(); this.phase = 0; this.lfoPhase = 0;
  }
  process(inputs, outputs, parameters) {
    const output = outputs[0][0];
    const baseFreq = parameters.baseFrequency[0];
    const depth = parameters.depth[0];
    const rate = parameters.rate[0];
    const dt = 1 / sampleRate;
    
    for (let i = 0; i < output.length; ++i) {
      const lfo = Math.sin(this.lfoPhase * 2 * Math.PI);
      const shift = lfo * depth;
      const freq = baseFreq * Math.pow(2, shift / 1200);
      
      this.phase += freq * dt;
      if (this.phase > 1) this.phase -= 1;
      
      // Richer tone (Fundamental + Harmonics)
      let val = Math.sin(this.phase * 2 * Math.PI);
      val += 0.3 * Math.sin(this.phase * 4 * Math.PI); // 2nd harmonic
      val += 0.15 * Math.sin(this.phase * 6 * Math.PI); // 3rd harmonic
      
      output[i] = val * 0.5; // Gain compensation
      
      this.lfoPhase += rate * dt;
      if (this.lfoPhase > 1) this.lfoPhase -= 1;
    }
    return true;
  }
}
registerProcessor('vibrato-processor', VibratoProcessor);
`;

let audioCtx, vibratoNode, gainNode;
let isPlaying = false;
let sfxCtx; // Separate context for UI sounds

async function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
        sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
}

function playNote(rate, depth) {
    initAudio().then(() => {
        if (vibratoNode) { try { vibratoNode.disconnect(); } catch(e){} }
        if (gainNode) { try { gainNode.disconnect(); } catch(e){} }
        
        vibratoNode = new AudioWorkletNode(audioCtx, 'vibrato-processor');
        gainNode = audioCtx.createGain();
        
        vibratoNode.parameters.get('rate').setValueAtTime(rate, audioCtx.currentTime);
        vibratoNode.parameters.get('depth').setValueAtTime(depth, audioCtx.currentTime);
        
        vibratoNode.connect(gainNode).connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.8, now + 0.1);
        
        isPlaying = true;
        updatePlayBtn();
    });
}

function stopNote() {
    if (gainNode) {
        const now = audioCtx.currentTime;
        gainNode.gain.cancelScheduledValues(now);
        gainNode.gain.setValueAtTime(gainNode.gain.value, now);
        gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
        setTimeout(() => { if(vibratoNode) vibratoNode.disconnect(); isPlaying=false; updatePlayBtn(); }, 150);
    }
}

// Simple SFX Synthesizer
function playSfx(type) {
    if (!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (sfxCtx.state === 'suspended') sfxCtx.resume();
    
    const osc = sfxCtx.createOscillator();
    const g = sfxCtx.createGain();
    osc.connect(g).connect(sfxCtx.destination);
    
    const now = sfxCtx.currentTime;
    
    if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        g.gain.setValueAtTime(0.1, now);
        g.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.3);
        g.gain.setValueAtTime(0.1, now);
        g.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'click') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        g.gain.setValueAtTime(0.05, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
    }
}

/* =========================================
   GAME LOGIC & STATE
   ========================================= */
const LEVELS = [
    { id: 1, title: "Wide vs Narrow", desc: "Learn to hear Depth", diff: 'easy', type: 'depth', range: [10, 50], rate: 5 },
    { id: 2, title: "Fast vs Slow", desc: "Learn to hear Speed", diff: 'easy', type: 'rate', range: [4, 7], depth: 30 },
    { id: 3, title: "Vibrato Basics", desc: "Mix of Speed and Depth", diff: 'medium', type: 'mix' },
    { id: 4, title: "Subtle Nuance", desc: "Harder distinctions", diff: 'hard', type: 'mix' },
    { id: 5, title: "Virtuoso", desc: "Expert ears only", diff: 'insane', type: 'mix' }
];

let state = {
    hearts: 5,
    gems: 100,
    streak: 0,
    lastLogin: null,
    xp: 0,
    unlocked: [1]
};

// Load / Save
function loadState() {
    const s = localStorage.getItem('vibratoState');
    if (s) state = { ...state, ...JSON.parse(s) };
    
    // Streak Logic
    const today = new Date().toDateString();
    if (state.lastLogin !== today) {
        const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
        if (state.lastLogin === yesterday.toDateString()) {
            // Streak continues (increment happens on game complete)
        } else {
            // Streak broken (if not first login)
            if (state.lastLogin) state.streak = 0;
        }
    }
    updateHeader();
}

function saveState() {
    localStorage.setItem('vibratoState', JSON.stringify(state));
    updateHeader();
}

function updateHeader() {
    document.getElementById('heart-val').innerText = state.hearts;
    document.getElementById('gem-val').innerText = state.gems;
    document.getElementById('streak-val').innerText = state.streak;
}

/* =========================================
   UI NAVIGATION
   ========================================= */
function showView(id) {
    document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    playSfx('click');
}

function goHome() {
    stopNote();
    renderPath();
    showView('home-view');
}

function openShop() {
    showView('shop-view');
}

function buyHearts() {
    if (state.hearts >= 5) { alert("Hearts full!"); return; }
    if (state.gems >= 350) {
        state.gems -= 350;
        state.hearts = 5;
        playSfx('correct');
        saveState();
        alert("Hearts Refilled!");
    } else {
        alert("Not enough gems!");
    }
}

/* =========================================
   GAMEPLAY
   ========================================= */
let currentLevel = null;
let round = 0;
let totalRounds = 5;
let target = {};
let options = [];

function startLevel(levelId) {
    if (state.hearts <= 0) {
        document.getElementById('modal-title').innerText = "Out of Hearts!";
        document.getElementById('modal-msg').innerText = "You need hearts to learn. Go to the shop to refill.";
        document.getElementById('modal-btn').innerText = "Go to Shop";
        document.getElementById('modal-btn').onclick = () => { closeModal(); openShop(); };
        document.getElementById('modal-overlay').classList.add('visible');
        return;
    }

    currentLevel = LEVELS.find(l => l.id === levelId);
    round = 0;
    showView('game-view');
    nextRound();
}

function nextRound() {
    if (round >= totalRounds) {
        finishLevel();
        return;
    }
    
    round++;
    document.getElementById('game-progress').style.width = `${((round-1)/totalRounds)*100}%`;
    document.getElementById('feedback-sheet').classList.remove('visible', 'correct', 'wrong');
    stopNote();
    
    // Generate Puzzle
    target = generateTarget(currentLevel);
    options = generateOptions(target, currentLevel);
    
    // Render UI
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'game-btn';
        btn.innerHTML = `${opt.rate} Hz<br><span style="font-size:0.8rem; font-weight:400">${opt.depth} cents</span>`;
        btn.onclick = () => checkAnswer(opt, btn);
        container.appendChild(btn);
    });
    
    // Auto play (optional, maybe better manual)
    // playNote(target.rate, target.depth); 
}

function generateTarget(lvl) {
    let r, d;
    if (lvl.type === 'depth') {
        r = lvl.rate;
        d = Math.floor(Math.random() * (lvl.range[1] - lvl.range[0]) + lvl.range[0]);
    } else if (lvl.type === 'rate') {
        r = (Math.random() * (lvl.range[1] - lvl.range[0]) + lvl.range[0]).toFixed(1);
        d = lvl.depth;
    } else {
        r = (Math.random() * 3 + 4).toFixed(1);
        d = Math.floor(Math.random() * 30 + 10);
    }
    return { rate: parseFloat(r), depth: parseInt(d) };
}

function generateOptions(tgt, lvl) {
    let opts = [tgt];
    // Create distractor
    let distractor = { ...tgt };
    const isRateQ = (lvl.type === 'rate') || (lvl.type === 'mix' && Math.random()>0.5);
    
    if (isRateQ) {
        let diff = lvl.diff === 'easy' ? 2.0 : (lvl.diff === 'medium' ? 1.0 : 0.4);
        distractor.rate = parseFloat((tgt.rate + (Math.random()>0.5 ? diff : -diff)).toFixed(1));
    } else {
        let diff = lvl.diff === 'easy' ? 25 : (lvl.diff === 'medium' ? 15 : 5);
        distractor.depth = tgt.depth + (Math.random()>0.5 ? diff : -diff);
        if (distractor.depth < 5) distractor.depth = 10;
    }
    
    opts.push(distractor);
    return opts.sort(() => Math.random() - 0.5);
}

function checkAnswer(selected, btnElement) {
    stopNote();
    const isCorrect = (selected.rate === target.rate && selected.depth === target.depth);
    const sheet = document.getElementById('feedback-sheet');
    const title = document.getElementById('sheet-title');
    const msg = document.getElementById('sheet-msg');
    const btn = document.getElementById('sheet-btn');
    
    document.querySelectorAll('.game-btn').forEach(b => b.disabled = true);
    
    if (isCorrect) {
        playSfx('correct');
        fireConfetti();
        btnElement.classList.add('correct');
        sheet.classList.add('correct');
        title.innerHTML = `<span>🎉</span> Excellent!`;
        msg.innerHTML = `That sounded just right.`;
        btn.classList.add('correct'); btn.classList.remove('wrong');
        btn.onclick = nextRound;
        
        // Reward
        state.xp += 10;
        state.gems += 2;
    } else {
        playSfx('wrong');
        if (navigator.vibrate) navigator.vibrate(200);
        btnElement.classList.add('wrong');
        state.hearts--;
        updateHeader(); // animate heart loss
        
        sheet.classList.add('wrong');
        title.innerHTML = `<span>💔</span> Incorrect`;
        msg.innerHTML = `Correct was: ${target.rate}Hz / ${target.depth}c`;
        btn.classList.add('wrong'); btn.classList.remove('correct');
        
        if (state.hearts <= 0) {
            btn.innerText = "End Game";
            btn.onclick = () => { sheet.classList.remove('visible'); goHome(); openShop(); };
        } else {
            btn.innerText = "Continue";
            btn.onclick = nextRound;
        }
    }
    
    saveState();
    sheet.classList.add('visible');
}

function finishLevel() {
    // Streak Update
    const today = new Date().toDateString();
    if (state.lastLogin !== today) {
        state.streak++;
        state.lastLogin = today;
    }
    
    // Unlock next level
    if (currentLevel.id === state.unlocked[state.unlocked.length - 1]) {
        const nextId = currentLevel.id + 1;
        if (nextId <= LEVELS.length && !state.unlocked.includes(nextId)) {
            state.unlocked.push(nextId);
        }
    }
    
    saveState();
    
    // Show Modal
    document.getElementById('modal-title').innerText = "Level Complete!";
    document.getElementById('modal-msg').innerText = `You earned XP and Gems! Streak: ${state.streak} 🔥`;
    document.getElementById('modal-btn').innerText = "Continue";
    document.getElementById('modal-btn').onclick = () => { closeModal(); goHome(); };
    document.getElementById('modal-overlay').classList.add('visible');
    playSfx('correct');
    fireConfetti();
}

function updatePlayBtn() {
    const btn = document.getElementById('listen-btn');
    if (isPlaying) {
        btn.classList.add('playing');
        document.getElementById('icon-play').style.display = 'none';
        document.getElementById('icon-stop').style.display = 'block';
    } else {
        btn.classList.remove('playing');
        document.getElementById('icon-play').style.display = 'block';
        document.getElementById('icon-stop').style.display = 'none';
    }
}

document.getElementById('listen-btn').addEventListener('click', () => {
    if (isPlaying) stopNote(); else playNote(target.rate, target.depth);
});

function closeModal() { document.getElementById('modal-overlay').classList.remove('visible'); }

/* =========================================
   RENDER PATH
   ========================================= */
function renderPath() {
    const list = document.getElementById('level-list');
    list.innerHTML = '';
    
    LEVELS.forEach(lvl => {
        const isUnlocked = state.unlocked.includes(lvl.id);
        const isCompleted = state.unlocked.includes(lvl.id + 1) || (isUnlocked && lvl.id < Math.max(...state.unlocked));
        
        const node = document.createElement('div');
        node.className = `level-node ${!isUnlocked ? 'locked' : ''} ${isCompleted ? 'completed' : ''}`;
        
        node.innerHTML = `
            <div class="level-icon">
                ${isCompleted ? '✓' : (isUnlocked ? '★' : '🔒')}
            </div>
            <div class="level-info">
                <h3>Level ${lvl.id}: ${lvl.title}</h3>
                <p>${lvl.desc}</p>
            </div>
        `;
        
        if (isUnlocked) {
            node.onclick = () => startLevel(lvl.id);
        }
        
        list.appendChild(node);
    });
}

/* =========================================
   VISUAL EFFECTS
   ========================================= */
const canvas = document.getElementById('effects-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function fireConfetti() {
    for (let i=0; i<80; i++) {
        particles.push({
            x: window.innerWidth/2, y: window.innerHeight/2,
            vx: (Math.random()-0.5)*15, vy: (Math.random()-1)*15,
            c: `hsl(${Math.random()*360}, 100%, 50%)`, size: Math.random()*8+4
        });
    }
    requestAnimationFrame(loopEffects);
}

function loopEffects() {
    if (particles.length === 0) return;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.5; // gravity
        ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.size, p.size);
        if (p.y > window.innerHeight) particles.splice(i, 1);
    });
    requestAnimationFrame(loopEffects);
}

// Init
loadState();
renderPath();

</script>
