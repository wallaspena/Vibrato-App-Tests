<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibrato Ear Trainer</title>
<style>
    :root {
        --bg: #f4f4f4;
        --card-bg: #ffffff;
        --text: #333333;
        --accent: #000000;
        --success: #28a745;
        --error: #dc3545;
        --radius: 12px;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    .game-container {
        background: var(--card-bg);
        padding: 30px;
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        width: 100%;
        max-width: 400px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    h1 { margin: 0 0 10px 0; font-size: 1.5rem; letter-spacing: -0.5px; }
    h2 { margin: 0 0 20px 0; font-size: 1rem; color: #666; font-weight: normal; }

    .stats-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        font-size: 0.9rem;
        font-weight: bold;
        color: #888;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
    }

    .listen-btn {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        color: white;
        font-size: 1.5rem; /* Icon size */
        cursor: pointer;
        margin-bottom: 25px;
        transition: transform 0.1s, background-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        margin-right: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    .listen-btn:active { transform: scale(0.95); }
    .listen-btn.playing { background-color: #444; }

    /* SVG Icons for Play/Stop */
    .icon { width: 30px; height: 30px; fill: white; }

    .options-grid {
        display: grid;
        gap: 10px;
        margin-bottom: 20px;
    }

    .option-btn {
        background: white;
        border: 2px solid #eee;
        padding: 15px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
    }

    .option-btn:hover { border-color: #ccc; }
    .option-btn:active { background-color: #f9f9f9; }

    .controls {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
    }

    select, .action-btn {
        padding: 10px 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: white;
        font-size: 0.9rem;
        cursor: pointer;
    }
    
    .action-btn { background: var(--accent); color: white; border: none; }

    /* Modal Overlay */
    .overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255,255,255,0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        padding: 20px;
    }
    
    .overlay.visible { opacity: 1; pointer-events: all; }
    
    .overlay h3 { font-size: 2rem; margin: 0 0 10px 0; }
    .overlay p { font-size: 1.1rem; color: #555; margin-bottom: 20px; }
    .overlay .btn-next {
        background: var(--accent); color: white; border: none;
        padding: 12px 30px; font-size: 1rem; border-radius: 25px;
        cursor: pointer;
    }

    .overlay.correct h3 { color: var(--success); }
    .overlay.wrong h3 { color: var(--error); }

    .high-scores {
        margin-top: 30px;
        font-size: 0.85rem;
        color: #777;
        text-align: left;
        width: 100%;
        max-width: 400px;
    }
    .high-scores ol { padding-left: 20px; }

    /* Record Breaker Animation */
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    .new-record { color: #d63384; animation: pulse 1s infinite; font-weight: bold; }

</style>
</head>
<body>

<div class="game-container">
    <h1>Vibrato Quiz</h1>
    <h2 id="difficulty-label">Difficulty: Medium</h2>

    <div class="stats-bar">
        <span id="round-display">Round: 1/5</span>
        <span id="score-display">Score: 0</span>
    </div>

    <!-- Play/Stop Button -->
    <button id="listen-btn" class="listen-btn" aria-label="Play Sound">
        <!-- Play Icon -->
        <svg id="icon-play" class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <!-- Stop Icon (Hidden by default) -->
        <svg id="icon-stop" class="icon" viewBox="0 0 24 24" style="display:none"><path d="M6 6h12v12H6z"/></svg>
    </button>
    <p style="font-size: 0.8rem; color: #999; margin-top:-15px; margin-bottom: 20px;">Tap to listen (A4 Note)</p>

    <div id="options-container" class="options-grid">
        <!-- Buttons injected by JS -->
    </div>

    <div class="controls">
        <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>
        <button id="restart-btn" class="action-btn">Restart Game</button>
    </div>

    <!-- Feedback Overlay -->
    <div id="feedback-overlay" class="overlay">
        <h3 id="feedback-title">Correct!</h3>
        <p id="feedback-message">The answer was 5.5Hz / 22 cents</p>
        <button id="next-round-btn" class="btn-next">Next Round</button>
    </div>
</div>

<div class="high-scores">
    <strong>Top 3 High Scores:</strong>
    <ol id="highscore-list">
        <li>-</li>
        <li>-</li>
        <li>-</li>
    </ol>
</div>

<script>
/**
 * --- AUDIO ENGINE (FROM PROVIDED APP) ---
 */
const workletCode = `
class VibratoProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [
      { name: 'baseFrequency', defaultValue: 442, minValue: 20, maxValue: 20000 },
      { name: 'depth', defaultValue: 50, minValue: 0, maxValue: 200 },
      { name: 'rate', defaultValue: 5.0, minValue: 0.1, maxValue: 20 }
    ];
  }

  constructor() {
    super();
    this.carrierPhase = 0;
    this.lfoPhase = 0;
    this.previousInstantaneousFreq = 0;
  }

  process(inputs, outputs, parameters) {
    const output = outputs[0];
    const outputChannel = output[0];
    const bufferLength = outputChannel.length;

    const baseFreqParams = parameters.baseFrequency;
    const depthParams = parameters.depth;
    const rateParams = parameters.rate;
    const twoPi = 2 * Math.PI;
    const inverseSampleRate = 1 / sampleRate;

    for (let i = 0; i < bufferLength; ++i) {
      const currentBaseFreq = baseFreqParams.length > 1 ? baseFreqParams[i] : baseFreqParams[0];
      const currentDepth = depthParams.length > 1 ? depthParams[i] : depthParams[0];
      const currentRate = rateParams.length > 1 ? rateParams[i] : rateParams[0];

      // Dynamic Calibration from original app
      const calibrationFactor = 1.0 + (currentRate * 0.005);
      const effectiveDepth = currentDepth * calibrationFactor;

      const lfoValue = Math.sin(this.lfoPhase * twoPi);

      const centsShift = lfoValue * effectiveDepth;
      const frequencyMultiplier = Math.pow(2, centsShift / 1200);
      const targetInstantaneousFreq = currentBaseFreq * frequencyMultiplier;

      if (this.previousInstantaneousFreq === 0) {
          this.previousInstantaneousFreq = targetInstantaneousFreq;
      }
      
      const averageFreq = (this.previousInstantaneousFreq + targetInstantaneousFreq) / 2;
      this.carrierPhase += averageFreq * inverseSampleRate;
      this.previousInstantaneousFreq = targetInstantaneousFreq;

      if (this.carrierPhase >= 1.0) this.carrierPhase -= 1.0;
      
      outputChannel[i] = Math.sin(this.carrierPhase * twoPi);

      this.lfoPhase += currentRate * inverseSampleRate;
      if (this.lfoPhase >= 1.0) this.lfoPhase -= 1.0;
    }

    return true;
  }
}
registerProcessor('vibrato-processor', VibratoProcessor);
`;

let audioContext = null;
let vibratoNode = null;
let gainNode = null;
let isPlaying = false;
const FIXED_GAIN = 0.60;
const FADE_TIME = 0.1;

// --- GAME LOGIC VARIABLES ---
const MAX_ROUNDS = 5;
let currentRound = 1;
let currentScore = 0;
let currentDifficulty = 'medium';
let targetValues = { rate: 0, depth: 0 };
let currentOptions = [];
let highScores = JSON.parse(localStorage.getItem('vibratoHighScores')) || [0, 0, 0];
let gameState = 'waiting'; // waiting, playing, feedback, gameover

// --- DOM ELEMENTS ---
const listenBtn = document.getElementById('listen-btn');
const iconPlay = document.getElementById('icon-play');
const iconStop = document.getElementById('icon-stop');
const optionsContainer = document.getElementById('options-container');
const roundDisplay = document.getElementById('round-display');
const scoreDisplay = document.getElementById('score-display');
const difficultySelect = document.getElementById('difficulty-select');
const difficultyLabel = document.getElementById('difficulty-label');
const restartBtn = document.getElementById('restart-btn');
const overlay = document.getElementById('feedback-overlay');
const feedbackTitle = document.getElementById('feedback-title');
const feedbackMessage = document.getElementById('feedback-message');
const nextRoundBtn = document.getElementById('next-round-btn');
const highscoreList = document.getElementById('highscore-list');

// --- AUDIO FUNCTIONS ---

async function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const blob = new Blob([workletCode], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        await audioContext.audioWorklet.addModule(url);
    }
    if (audioContext.state === 'suspended') {
        await audioContext.resume();
    }
}

function playSound() {
    if (isPlaying) {
        stopSound();
        return;
    }

    initAudio().then(() => {
        // Disconnect old nodes if they exist
        if (vibratoNode) { try { vibratoNode.disconnect(); } catch(e){} }
        if (gainNode) { try { gainNode.disconnect(); } catch(e){} }

        vibratoNode = new AudioWorkletNode(audioContext, 'vibrato-processor');
        gainNode = audioContext.createGain();

        // Connect
        vibratoNode.connect(gainNode);
        gainNode.connect(audioContext.destination);

        // Set Parameters
        const params = vibratoNode.parameters;
        // A4 = 442Hz in the original app logic
        params.get('baseFrequency').setValueAtTime(442, audioContext.currentTime);
        params.get('rate').setValueAtTime(targetValues.rate, audioContext.currentTime);
        params.get('depth').setValueAtTime(targetValues.depth, audioContext.currentTime);

        // Fade in
        gainNode.gain.setValueAtTime(0, audioContext.currentTime);
        gainNode.gain.linearRampToValueAtTime(FIXED_GAIN, audioContext.currentTime + FADE_TIME);

        isPlaying = true;
        updatePlayButtonState();
    });
}

function stopSound() {
    if (!isPlaying || !gainNode) return;
    
    const now = audioContext.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0, now + FADE_TIME);

    setTimeout(() => {
        if (vibratoNode) { 
            vibratoNode.disconnect(); 
            vibratoNode = null;
        }
        isPlaying = false;
        updatePlayButtonState();
    }, (FADE_TIME * 1000) + 50);
}

function updatePlayButtonState() {
    if (isPlaying) {
        listenBtn.classList.add('playing');
        iconPlay.style.display = 'none';
        iconStop.style.display = 'block';
    } else {
        listenBtn.classList.remove('playing');
        iconPlay.style.display = 'block';
        iconStop.style.display = 'none';
    }
}

// --- GAME LOGIC ---

function updateHighScoresDisplay() {
    highscoreList.innerHTML = highScores
        .map(score => `<li>${score} pts</li>`)
        .join('');
}

function getRandom(min, max, decimals = 0) {
    const val = Math.random() * (max - min) + min;
    return parseFloat(val.toFixed(decimals));
}

function generateTarget() {
    // Speed: 4 to 7 Hz
    const rate = getRandom(4, 7, 1);
    // Amplitude: 11 to 44 cents
    const depth = getRandom(11, 44, 0);
    return { rate, depth };
}

function generateOptions(target, difficulty) {
    let opts = [target];
    
    // Define deviations based on difficulty
    let rateDev, depthDev;
    
    if (difficulty === 'easy') {
        rateDev = 1.5; // Big difference
        depthDev = 15;
    } else if (difficulty === 'medium') {
        rateDev = 0.8;
        depthDev = 8;
    } else { // Hard
        rateDev = 0.3; // Very subtle
        depthDev = 4;
    }

    // Generate 2 wrong answers
    for (let i = 0; i < 2; i++) {
        let newOpt;
        let valid = false;
        let attempts = 0;

        while (!valid && attempts < 20) {
            attempts++;
            // Flip a coin to deviate positive or negative
            const rDir = Math.random() > 0.5 ? 1 : -1;
            const dDir = Math.random() > 0.5 ? 1 : -1;

            // Add some jitter to the deviation so it's not always exactly the same distance
            const rJitter = (Math.random() * 0.4) - 0.2; 
            const dJitter = Math.floor(Math.random() * 4) - 2;

            let r = parseFloat((target.rate + (rateDev + rJitter) * rDir).toFixed(1));
            let d = Math.round(target.depth + (depthDev + dJitter) * dDir);

            // Clamp values
            if (r < 4) r = 4; if (r > 7) r = 7;
            if (d < 11) d = 11; if (d > 44) d = 44;

            newOpt = { rate: r, depth: d };

            // Ensure uniqueness against existing options
            const exists = opts.some(o => o.rate === newOpt.rate && o.depth === newOpt.depth);
            
            // Also ensure it's not TOO close to target in Hard mode (otherwise it's unfair)
            const tooClose = Math.abs(newOpt.rate - target.rate) < 0.1 && Math.abs(newOpt.depth - target.depth) < 2;

            if (!exists && !tooClose) valid = true;
        }
        opts.push(newOpt);
    }

    // Shuffle options
    return opts.sort(() => Math.random() - 0.5);
}

function startRound() {
    stopSound();
    gameState = 'playing';
    targetValues = generateTarget();
    currentOptions = generateOptions(targetValues, currentDifficulty);
    
    roundDisplay.textContent = `Round: ${currentRound}/${MAX_ROUNDS}`;
    scoreDisplay.textContent = `Score: ${currentScore}`;
    
    renderOptions();
}

function renderOptions() {
    optionsContainer.innerHTML = '';
    currentOptions.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `Speed: ${opt.rate} Hz | Amp: ${opt.depth} cents`;
        btn.onclick = () => handleGuess(opt);
        optionsContainer.appendChild(btn);
    });
}

function handleGuess(selectedOption) {
    stopSound();
    
    const isCorrect = (selectedOption.rate === targetValues.rate && selectedOption.depth === targetValues.depth);
    
    // Prepare Feedback
    overlay.className = 'overlay visible';
    if (isCorrect) {
        overlay.classList.add('correct');
        overlay.classList.remove('wrong');
        feedbackTitle.textContent = "Correct!";
        
        // Calculate Score based on difficulty
        let points = 10;
        if (currentDifficulty === 'medium') points = 20;
        if (currentDifficulty === 'hard') points = 30;
        currentScore += points;
        
        // Nice Message
        const praises = ["Excellent ear!", "Spot on!", "Perfect pitch perception!", "Great job!"];
        feedbackMessage.textContent = praises[Math.floor(Math.random() * praises.length)];
    } else {
        overlay.classList.add('wrong');
        overlay.classList.remove('correct');
        feedbackTitle.textContent = "Wrong Answer";
        feedbackMessage.innerHTML = `The correct setting was:<br><strong>${targetValues.rate} Hz / ${targetValues.depth} cents</strong>`;
    }

    scoreDisplay.textContent = `Score: ${currentScore}`;

    if (currentRound >= MAX_ROUNDS) {
        nextRoundBtn.textContent = "Finish Game";
        gameState = 'gameover';
    } else {
        nextRoundBtn.textContent = "Next Round";
        gameState = 'feedback';
    }
}

function endGame() {
    overlay.className = 'overlay visible correct'; // Use correct style for clean look
    feedbackTitle.textContent = "Game Over!";
    
    let msg = `Final Score: ${currentScore}<br>`;
    
    // Check High Score
    const lowestHigh = highScores[2];
    if (currentScore > lowestHigh) {
        highScores.push(currentScore);
        highScores.sort((a, b) => b - a);
        highScores = highScores.slice(0, 3);
        localStorage.setItem('vibratoHighScores', JSON.stringify(highScores));
        msg += `<br><span class="new-record">🏆 NEW RECORD! 🏆</span>`;
    }
    
    feedbackMessage.innerHTML = msg;
    nextRoundBtn.textContent = "Play Again";
    updateHighScoresDisplay();
}

function restartGame() {
    currentRound = 1;
    currentScore = 0;
    currentDifficulty = difficultySelect.value;
    difficultyLabel.textContent = `Difficulty: ${currentDifficulty.charAt(0).toUpperCase() + currentDifficulty.slice(1)}`;
    overlay.classList.remove('visible');
    startRound();
}

// --- EVENT LISTENERS ---

listenBtn.addEventListener('click', () => {
    // Need user gesture to start AudioContext
    playSound();
});

nextRoundBtn.addEventListener('click', () => {
    if (gameState === 'gameover') {
        restartGame();
    } else if (currentRound < MAX_ROUNDS) {
        currentRound++;
        overlay.classList.remove('visible');
        startRound();
    } else {
        endGame();
    }
});

restartBtn.addEventListener('click', () => {
    stopSound();
    restartGame();
});

difficultySelect.addEventListener('change', () => {
    // If they change difficulty mid-game, restart game
    stopSound();
    restartGame();
});

// Initialize
updateHighScoresDisplay();
startRound();

</script>
</body>
</html>
